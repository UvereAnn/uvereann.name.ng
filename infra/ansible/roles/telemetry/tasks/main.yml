---
- name: Download lightweight Promtail binary
  get_url:
    url: "https://github.com/grafana/loki/releases/download/v2.9.4/promtail-linux-amd64.zip"
    dest: "/tmp/promtail.zip"

- name: Unzip Promtail binary to system bin
  unarchive:
    src: "/tmp/promtail.zip"
    dest: "/usr/local/bin"
    remote_src: yes
    creates: "/usr/local/bin/promtail-linux-amd64"

- name: Create Promtail configuration directory
  file:
    path: "/etc/promtail"
    state: directory
    mode: '0755'

- name: Deploy Promtail configuration file
  template:
    src: "promtail-config.yaml.j2"
    dest: "/etc/promtail/config.yaml"

- name: Create Promtail Systemd Service definition
  copy:
    dest: "/etc/systemd/system/promtail.service"
    content: |
      [Unit]
      Description=Promtail Client for Grafana Loki
      After=network.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/promtail-linux-amd64 -config.file=/etc/promtail/config.yaml
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target

- name: Start and enable Promtail service
  systemd:
    name: promtail
    state: started
    enabled: yes