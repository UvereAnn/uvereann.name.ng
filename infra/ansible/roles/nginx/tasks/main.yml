# roles/nginx/tasks/main.yml
#
# CONCEPT: Nginx sits in front of everything.
# It handles two jobs:
#
# 1. Serve React static files directly
#    When someone visits uvereann.name.ng/projects,
#    Nginx serves the index.html from the React build.
#    Node.js is never involved — Nginx is much faster
#    at serving static files.
#
# 2. Proxy API requests to Node.js
#    When the frontend calls /api/projects,
#    Nginx forwards that to localhost:3000 (your Express app)
#    and returns the response to the browser.
#
# This is called a reverse proxy pattern.
# The browser only ever talks to Nginx on port 80/443.
# Node.js is never directly exposed to the internet.

---
- name: Install Nginx
  apt:
    name: nginx
    state: present

- name: Remove default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  # The default site shows the "Welcome to Nginx" page
  # We replace it with our own configuration

- name: Copy portfolio Nginx configuration
  template:
    src: portfolio.conf.j2
    dest: /etc/nginx/sites-available/portfolio.conf
    mode: "0644"
  notify: reload nginx
  # notify: triggers the 'reload nginx' handler
  # Handlers run at the end of the play if notified

- name: Enable portfolio site
  file:
    src: /etc/nginx/sites-available/portfolio.conf
    dest: /etc/nginx/sites-enabled/portfolio.conf
    state: link
  # Creates a symlink from sites-enabled to sites-available
  # This is the standard Nginx pattern for enabling sites
  notify: reload nginx

- name: Test Nginx configuration
  command: nginx -t
  # nginx -t validates the config without restarting
  # If this fails, Ansible stops before reloading Nginx
  # Prevents deploying a broken config that takes the site down

- name: Start and enable Nginx
  systemd:
    name: nginx
    state: started
    enabled: true